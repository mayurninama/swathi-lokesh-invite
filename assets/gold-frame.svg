  <rect x="44" y="48" width="312" height="404" rx="4" stroke="#6f440c" stroke-width="2.5"/>
  <!-- Top & Bottom Baroque Crest Ornaments -->
  <path d="M148 22 C164 6, 184 4, 200 18 C216 4, 236 6, 252 22 C236 28, 222 34, 200 34 C178 34, 164 28, 148 22 Z" fill="url(#frameOuter)" stroke="#7d4f10" stroke-width="1.4"/>
  <circle cx="200" cy="18" r="5" fill="#fff2c2" stroke="#8a5a14" stroke-width="1.2"/>
  <path d="M148 478 C164 494, 184 496, 200 482 C216 496, 236 494, 252 478 C236 472, 222 466, 200 466 C178 466, 164 472, 148 478 Z" fill="url(#frameOuter)" stroke="#7d4f10" stroke-width="1.4"/>
  <circle cx="200" cy="482" r="5" fill="#fff2c2" stroke="#8a5a14" stroke-width="1.2"/>
