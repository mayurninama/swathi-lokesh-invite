    <path d="M8 38 C8 12, 12 8, 38 8 C52 8, 60 18, 46 26 C34 24, 24 34, 26 46 C18 60, 8 52, 8 38 Z"/>
    <path d="M392 38 C392 12, 388 8, 362 8 C348 8, 340 18, 354 26 C366 24, 376 34, 374 46 C382 60, 392 52, 392 38 Z"/>
    <path d="M8 462 C8 488, 12 492, 38 492 C52 492, 60 482, 46 474 C34 476, 24 466, 26 454 C18 440, 8 448, 8 462 Z"/>
    <path d="M392 462 C392 488, 388 492, 362 492 C348 492, 340 482, 354 474 C366 476, 376 466, 374 454 C382 440, 392 448, 392 462 Z"/>
