  <!-- Beaded filigree accents along sides -->
  <circle cx="22" cy="145" r="3" fill="#fff0ba"/>
  <circle cx="22" cy="250" r="4.5" fill="#fff0ba"/>
  <circle cx="22" cy="355" r="3" fill="#fff0ba"/>
  <circle cx="378" cy="145" r="3" fill="#fff0ba"/>
  <circle cx="378" cy="250" r="4.5" fill="#fff0ba"/>
  <circle cx="378" cy="355" r="3" fill="#fff0ba"/>
