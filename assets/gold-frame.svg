<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" fill="none">
  <defs>
    <linearGradient id="frameOuter" x1="0" y1="0" x2="400" y2="500" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#f2d68b"/>
      <stop offset="28%" stop-color="#c69238"/>
      <stop offset="55%" stop-color="#f8e3a3"/>
      <stop offset="80%" stop-color="#a87424"/>
      <stop offset="100%" stop-color="#e5be6a"/>
    </linearGradient>
    <linearGradient id="frameInner" x1="400" y1="0" x2="0" y2="500" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#9b691d"/>
      <stop offset="50%" stop-color="#ebd081"/>
      <stop offset="100%" stop-color="#875714"/>
    </linearGradient>
    <mask id="apertureMask">
